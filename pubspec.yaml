name: pyramid_of_kings
description: "Royal fitness journal for iPhone and iPad."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/palaces.png




